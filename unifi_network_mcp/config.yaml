name: UniFi Network MCP
version: "0.48.1"
slug: unifi_network_mcp
description: >-
  MCP server for the UniFi Network application (sirkirby/unifi-mcp), so AI
  assistants can read and - if allowed - manage your UniFi network.
url: https://github.com/adkulik/ha-apps/tree/main/unifi_network_mcp
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# No host ports: the server is only reachable on the internal Home Assistant
# app network (e.g. from the Cloudflared app). Never publish it on the LAN.
options:
  unifi_host: 192.168.1.1
  unifi_port: 443
  unifi_username: ""
  unifi_password: ""
  unifi_site: default
  verify_ssl: false
  allowed_hosts:
    - unifi-mcp.kulik.network
  allow_create: false
  allow_update: false
  allow_delete: false
  permission_mode: confirm
  tool_registration_mode: lazy
  extra_env: []
schema:
  unifi_host: str
  unifi_port: port
  unifi_username: str
  unifi_password: password
  unifi_site: str
  verify_ssl: bool
  allowed_hosts:
    - str
  allow_create: bool
  allow_update: bool
  allow_delete: bool
  permission_mode: list(confirm|bypass)
  tool_registration_mode: list(lazy|eager|meta_only)
  extra_env:
    - match(^[A-Z][A-Z0-9_]*=.*$)
